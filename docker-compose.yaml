services:
  # Apache + PHP
  web:
    build: .
    container_name: docampp_web
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./htdocs:/var/www/html
      - ./apache-config:/etc/apache2/sites-available:ro
      - ./php-ini:/usr/local/etc/php/conf.d:ro
      - ./logs/apache:/var/log/apache2
    depends_on:
      - db
    networks:
      - docampp-network

  # MariaDB (MySQL)
  db:
    image: mariadb:latest
    container_name: docampp_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=docampp_db
      - MYSQL_USER=docampp_user
      - MYSQL_PASSWORD=docampp_pass
    volumes:
      - ./db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - docampp-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: docampp_phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      - UPLOAD_LIMIT=100M
    depends_on:
      - db
    networks:
      - docampp-network

networks:
  docampp-network:
    driver: bridge
